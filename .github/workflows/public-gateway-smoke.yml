name: Public gateway smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-gateway-smoke.yml"
      - "src/**"
      - "pyproject.toml"
  schedule:
    # Daily 05:17 Asia/Shanghai = 21:17 UTC (previous day).
    - cron: "17 21 * * *"

permissions:
  contents: read

jobs:
  public-gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install probe dependency
        run: python -m pip install httpx==0.28.1

      - name: Verify HTTPS route and authentication boundary without credentials
        shell: bash
        run: |
          python - <<'PY'
          import httpx
          url = "https://omniroute.qjai.org/v1/chat/completions"
          with httpx.Client(timeout=15.0, follow_redirects=False, trust_env=False) as client:
              response = client.get(url, headers={"Accept": "application/json"})
          if response.status_code != 401:
              raise SystemExit(f"Unexpected gateway status: {response.status_code}; expected unauthenticated 401")
          print("HTTPS reachable; gateway requires authentication (401). No model call made.")
          PY
