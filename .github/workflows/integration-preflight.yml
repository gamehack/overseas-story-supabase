name: Integration preflight (read-only)
# Verification rerun after SUPABASE_CA_CERT secret update.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/integration-preflight.yml"
  schedule:
    - cron: "41 20 * * 0" # Monday 04:41 Asia/Shanghai, after the weekly pipeline.

permissions:
  contents: read

concurrency:
  group: overseas-stories-integration-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ vars.OVERSEAS_STORIES_INTEGRATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
      AI_EXTRACTION_ENDPOINT: ${{ secrets.AI_EXTRACTION_ENDPOINT }}
      AI_EXTRACTION_API_KEY: ${{ secrets.AI_EXTRACTION_API_KEY }}
      AI_EXTRACTION_MODEL: ${{ secrets.AI_EXTRACTION_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install .

      - name: Set up ephemeral TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_CA_CERT:-}" ]]; then
            echo "::error::Missing required GitHub Actions secret: SUPABASE_CA_CERT"
            exit 1
          fi
          printf '%s\n' "$SUPABASE_CA_CERT" > "$RUNNER_TEMP/supabase-ca.crt"
          chmod 600 "$RUNNER_TEMP/supabase-ca.crt"
          echo "PGSSLROOTCERT=$RUNNER_TEMP/supabase-ca.crt" >> "$GITHUB_ENV"

      - name: Verify Supabase CA certificate configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          import ssl
          from pathlib import Path
          from psycopg.conninfo import conninfo_to_dict

          cfg = conninfo_to_dict(os.environ.get("DATABASE_URL", ""))
          if cfg.get("sslmode") != "verify-full":
              raise SystemExit("DATABASE_URL must use sslmode=verify-full")
          if cfg.get("sslrootcert"):
              raise SystemExit("Remove server-local sslrootcert paths from DATABASE_URL; the workflow injects PGSSLROOTCERT")
          ca_file = os.environ.get("PGSSLROOTCERT", "")
          if not ca_file or not Path(ca_file).is_file():
              raise SystemExit("SUPABASE_CA_CERT was not installed for this runner")
          ssl.create_default_context(cafile=ca_file)
          print("Supabase CA certificate is present and valid; strict TLS verification is configured.")
          PY

      - name: Diagnose Supabase DSN structure without printing credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          from psycopg.conninfo import conninfo_to_dict
          try:
              cfg = conninfo_to_dict(os.environ.get("DATABASE_URL", ""))
          except Exception:
              raise SystemExit("DATABASE_URL is not a valid PostgreSQL connection string")
          username = cfg.get("user") or ""
          host = cfg.get("host") or ""
          flags = {
              "username_has_project_suffix": "." in username and len(username.rsplit(".", 1)[-1]) >= 12,
              "host_is_shared_pooler": host.endswith(".pooler.supabase.com"),
              "session_pooler_port_5432": str(cfg.get("port") or "") == "5432",
              "password_present": bool(cfg.get("password")),
              "strict_tls_verification": cfg.get("sslmode") == "verify-full",
              "no_server_local_ca_path_in_dsn": not bool(cfg.get("sslrootcert")),
          }
          for label, valid in flags.items():
              print(f"{label}: {'OK' if valid else 'MISMATCH'}")
          PY

      - name: Verify read-only Supabase connectivity
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg
          dsn = os.environ.get("DATABASE_URL", "")
          if not dsn or "sslmode=" not in dsn or "sslmode=disable" in dsn:
              raise SystemExit("DATABASE_URL is missing or TLS is not configured")
          with psycopg.connect(dsn, connect_timeout=15, options="-c default_transaction_read_only=on") as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT count(*) FROM overseas_stories.stories")
                  stories = cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM overseas_stories.facts")
                  facts = cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM overseas_stories.story_localizations")
                  localizations = cur.fetchone()[0]
          print(f"Supabase read-only connection OK; stories={stories}, facts={facts}, zh_stories={localizations}")
          PY

      - name: Verify authenticated model gateway with synthetic story (read-only smoke)
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          from datetime import date
          from overseas_stories.extraction import StructuredExtractor
          from overseas_stories.models import Story

          story_body = (
              "I founded a small software company called Example Works in 2024. "
              "The first product launch failed because customers could not finish onboarding. "
              "I interviewed ten users and simplified the setup. "
              "In the first month after the change, I made 500 dollars in revenue."
          )
          story = Story(
              source_item_id="github-runner-integration-smoke",
              title="A synthetic founder story for gateway verification",
              subtitle="",
              source_url="https://example.invalid/integration-smoke",
              published_at=date(2026, 1, 1),
              raw_markdown=story_body,
              body_markdown=story_body,
              person_ids=(),
              person_roles={},
              metadata={},
              content_hash="integration-smoke",
          )
          import os
          expected_endpoint = "https://omniroute.qjai.org/v1/chat/completions"
          if os.getenv("AI_EXTRACTION_ENDPOINT", "").strip().rstrip("/") != expected_endpoint:
              raise SystemExit("AI_EXTRACTION_ENDPOINT does not match the expected public OmniRoute chat completions URL")
          extractor = StructuredExtractor()
          if not extractor.configured:
              raise SystemExit("AI gateway secrets are missing")
          result = extractor.extract(story, "integration-smoke")
          if not result.data.get("evidence_check_passed"):
              raise SystemExit("Gateway returned output that failed source-evidence validation")
          print("Authenticated model gateway smoke passed; no database writes were made.")
          PY

      - name: Verify indie.md source adapter without database writes or AI calls
        if: ${{ !cancelled() }}
        run: python -m overseas_stories.cli sync --dry-run --source indie-md --ai-limit 0
