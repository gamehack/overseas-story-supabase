name: Integration preflight (read-only)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/integration-preflight.yml"
  schedule:
    - cron: "41 20 * * 0" # Monday 04:41 Asia/Shanghai, after the weekly pipeline.

permissions:
  contents: read

concurrency:
  group: overseas-stories-integration-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ vars.OVERSEAS_STORIES_INTEGRATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
      AI_EXTRACTION_ENDPOINT: ${{ secrets.AI_EXTRACTION_ENDPOINT }}
      AI_EXTRACTION_API_KEY: ${{ secrets.AI_EXTRACTION_API_KEY }}
      AI_EXTRACTION_MODEL: ${{ secrets.AI_EXTRACTION_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install .

      - name: Set up ephemeral TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_CA_CERT:-}" ]]; then
            printf '%s\n' "$SUPABASE_CA_CERT" > "$RUNNER_TEMP/supabase-ca.crt"
            chmod 600 "$RUNNER_TEMP/supabase-ca.crt"
            echo "PGSSLROOTCERT=$RUNNER_TEMP/supabase-ca.crt" >> "$GITHUB_ENV"
          fi

      - name: Verify read-only Supabase connectivity
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg
          dsn = os.environ.get("DATABASE_URL", "")
          if not dsn or "sslmode=" not in dsn or "sslmode=disable" in dsn:
              raise SystemExit("DATABASE_URL is missing or TLS is not configured")
          with psycopg.connect(dsn, connect_timeout=15, options="-c default_transaction_read_only=on") as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT count(*) FROM overseas_stories.stories")
                  stories = cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM overseas_stories.facts")
                  facts = cur.fetchone()[0]
                  cur.execute("SELECT count(*) FROM overseas_stories.story_localizations")
                  localizations = cur.fetchone()[0]
          print(f"Supabase read-only connection OK; stories={stories}, facts={facts}, zh_stories={localizations}")
          PY

      - name: Verify authenticated model gateway with synthetic story (manual preflight only)
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import date
          from overseas_stories.extraction import StructuredExtractor
          from overseas_stories.models import Story

          story_body = (
              "I founded a small software company called Example Works in 2024. "
              "The first product launch failed because customers could not finish onboarding. "
              "I interviewed ten users and simplified the setup. "
              "In the first month after the change, I made 500 dollars in revenue."
          )
          story = Story(
              source_item_id="github-runner-integration-smoke",
              title="A synthetic founder story for gateway verification",
              subtitle="",
              source_url="https://example.invalid/integration-smoke",
              published_at=date(2026, 1, 1),
              raw_markdown=story_body,
              body_markdown=story_body,
              person_ids=(),
              person_roles={},
              metadata={},
              content_hash="integration-smoke",
          )
          extractor = StructuredExtractor()
          if not extractor.configured:
              raise SystemExit("AI gateway secrets are missing")
          result = extractor.extract(story, "integration-smoke")
          if not result.data.get("evidence_check_passed"):
              raise SystemExit("Gateway returned output that failed source-evidence validation")
          print("Authenticated model gateway smoke passed; no database writes were made.")
          PY

      - name: Verify indie.md source adapter without database writes or AI calls
        run: python -m overseas_stories.cli sync --dry-run --source indie-md --ai-limit 0
