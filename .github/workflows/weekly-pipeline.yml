name: Weekly overseas founder stories

on:
  schedule:
    # Monday 03:30 Asia/Shanghai = Sunday 19:30 UTC (China has no DST).
    - cron: "30 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overseas-story-weekly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
      AI_EXTRACTION_ENDPOINT: ${{ secrets.AI_EXTRACTION_ENDPOINT }}
      AI_EXTRACTION_API_KEY: ${{ secrets.AI_EXTRACTION_API_KEY }}
      AI_EXTRACTION_MODEL: ${{ secrets.AI_EXTRACTION_MODEL }}
      SUBSTACK_CONTENT_AUTHORIZED: ${{ vars.SUBSTACK_CONTENT_AUTHORIZED || 'false' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install optional Supabase CA certificate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_CA_CERT:-}" ]]; then
            printf '%s\n' "$SUPABASE_CA_CERT" > "$RUNNER_TEMP/supabase-ca.crt"
            chmod 600 "$RUNNER_TEMP/supabase-ca.crt"
            echo "PGSSLROOTCERT=$RUNNER_TEMP/supabase-ca.crt" >> "$GITHUB_ENV"
          fi

      - name: Validate runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL AI_EXTRACTION_ENDPOINT AI_EXTRACTION_API_KEY AI_EXTRACTION_MODEL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done
          case "$AI_EXTRACTION_ENDPOINT" in
            https://*) ;;
            *) echo "::error::AI_EXTRACTION_ENDPOINT must use HTTPS"; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *sslmode=disable*) echo "::error::DATABASE_URL must require TLS"; exit 1 ;;
            *sslmode=require*|*sslmode=verify-ca*|*sslmode=verify-full*) ;;
            *) echo "::error::DATABASE_URL must include sslmode=require or stronger"; exit 1 ;;
          esac
          if [[ "$DATABASE_URL" == *sslmode=verify-full* && -z "${SUPABASE_CA_CERT:-}" ]]; then
            echo "::error::Set SUPABASE_CA_CERT when DATABASE_URL uses sslmode=verify-full"
            exit 1
          fi
          echo "Runtime secrets are present. Substack authorization flag: $SUBSTACK_CONTENT_AUTHORIZED"

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: M1/M2 — collect and extract
        run: |
          set -o pipefail
          python -m overseas_stories.cli sync --source all --ai-limit 5 | tee "$RUNNER_TEMP/m1-m2-report.json"

      - name: M3 — update editorial index
        run: |
          set -o pipefail
          python -m overseas_stories.editorial --apply | tee "$RUNNER_TEMP/m3-report.json"

      - name: M4 — update Chinese research layer (max 5 calls)
        run: |
          set -o pipefail
          python -m overseas_stories.localize --apply --limit 5 | tee "$RUNNER_TEMP/m4-report.json"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Overseas founder stories pipeline"
            echo "- Schedule: Monday 03:30 Asia/Shanghai"
            echo "- Runtime: GitHub-hosted runner"
            echo "- Substack content authorization: $SUBSTACK_CONTENT_AUTHORIZED"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
